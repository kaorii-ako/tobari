# Every push to rewrite and every v* tag: build the shell, run the checks, package an AppImage and smoke-test it.
# A tag's AppImage is the release build; packaging/release.sh signs it locally (the key never enters CI).
name: build
on:
  push:
    branches: [rewrite]
    tags: ['v*']
  workflow_dispatch:

env:
  CEF: cef_binary_156.0.14+g4fa4ab5+chromium-156.0.8078.48_linux64_minimal

jobs:
  appimage:
    # 22.04 keeps the AppImage's glibc floor low and lets Chromium use user namespaces without an AppArmor profile.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build g++-12 libgtk-3-dev libnss3 cage fonts-noto-cjk fonts-noto-core >/dev/null
          # Ubuntu 22.04 has no minisign package; the installer test needs it to sign its fake releases.
          curl -sSfL https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz -o /tmp/ms.tgz
          echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  /tmp/ms.tgz" | sha256sum -c
          sudo tar xzf /tmp/ms.tgz -C /usr/local/bin --strip-components=2 minisign-linux/x86_64/minisign
          # shortcut: appimagetool only publishes a moving "continuous" build; pin by checksum once it is stable.
          sudo curl -sSfLo /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool

      - uses: actions/cache@v4
        with: { path: cef, key: "${{ env.CEF }}" }

      - name: CEF
        run: |
          [ -d cef ] || { mkdir cef; curl -sSfL "https://cef-builds.spotifycdn.com/${CEF//+/%2B}.tar.bz2" | tar xj -C cef; }

      - name: Build
        run: |
          CC=gcc-12 CXX=g++-12 cmake -G Ninja -S shell -B build -DCEF_ROOT="$PWD/cef/$CEF" -DCMAKE_BUILD_TYPE=Release
          ninja -k 0 -C build

      - name: Checks
        run: |
          build/util_test
          build/block_test
          python3 tools/contrast.py

      - name: AppImage
        env: { APPIMAGE_EXTRACT_AND_RUN: 1 }
        run: sh packaging/appimage.sh build/out "$([ "$GITHUB_REF_TYPE" = tag ] && echo "${GITHUB_REF_NAME#v}" || echo "0.5.0-dev.$GITHUB_RUN_NUMBER")"

      - name: Smoke test (CJK and Thai render through the AppImage)
        env: { APPIMAGE_EXTRACT_AND_RUN: 1 }
        run: |
          export XDG_DATA_HOME=$(mktemp -d)
          bash bench/script_test.sh tobari dist/Tobari-*.AppImage --ozone-platform=wayland | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Privacy, HTTPS-Only, assistant, import and CLI checks
        env: { APPIMAGE_EXTRACT_AND_RUN: 1 }
        run: |
          export XDG_DATA_HOME=$(mktemp -d)
          TEST=privacy-test bash bench/script_test.sh tobari dist/Tobari-*.AppImage --ozone-platform=wayland | tee -a "$GITHUB_STEP_SUMMARY"
          bash bench/https_test.sh "$(ls dist/Tobari-*.AppImage)" | tee -a "$GITHUB_STEP_SUMMARY"
          bash bench/ai_test.sh "$(ls dist/Tobari-*.AppImage)" | tee -a "$GITHUB_STEP_SUMMARY"
          bash bench/import_test.sh "$(ls dist/Tobari-*.AppImage)" | tee -a "$GITHUB_STEP_SUMMARY"
          bash bench/cli_test.sh "$(ls dist/Tobari-*.AppImage)" | tee -a "$GITHUB_STEP_SUMMARY"
          bash bench/profile_test.sh "$(ls dist/Tobari-*.AppImage)" | tee -a "$GITHUB_STEP_SUMMARY"
          bash bench/mcp_test.sh "$(ls dist/Tobari-*.AppImage)" | tee -a "$GITHUB_STEP_SUMMARY"
          bash bench/shot_test.sh "$(ls dist/Tobari-*.AppImage)" | tee -a "$GITHUB_STEP_SUMMARY"
          bash bench/burn_test.sh "$(ls dist/Tobari-*.AppImage)" | tee -a "$GITHUB_STEP_SUMMARY"
          node bench/calc_test.js | tee -a "$GITHUB_STEP_SUMMARY"
          node bench/clean_test.js | tee -a "$GITHUB_STEP_SUMMARY"
          bash bench/install_test.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Idle network capture (first start fetches only the filter lists; idle contacts nothing)
        env: { APPIMAGE_EXTRACT_AND_RUN: 1 }
        run: |
          export XDG_DATA_HOME=$(mktemp -d)
          app=$(ls dist/Tobari-*.AppImage)
          bash bench/idle_net.sh first-start 60 "$app" --ozone-platform=wayland | tee -a "$GITHUB_STEP_SUMMARY"
          bash bench/idle_net.sh idle 120 "$app" --ozone-platform=wayland | tee -a "$GITHUB_STEP_SUMMARY"
          # bash -e ignores a failing "! cmd", so test explicitly.
          if grep -vE "blocked|no request|^(easylist\.to|ublockorigin\.github\.io)\s" bench/results/idle-net-first-start.txt \
             || grep -vE "blocked|no request" bench/results/idle-net-idle.txt; then exit 1; fi

      - uses: actions/upload-artifact@v4
        with: { name: tobari-appimage, path: dist/ }

  windows:
    # Portable zip, unsigned (SmartScreen warns on first run). Separate job that can't fail the Linux release.
    runs-on: windows-2022
    timeout-minutes: 45
    continue-on-error: true
    env:
      CEFW: cef_binary_156.0.14+g4fa4ab5+chromium-156.0.8078.48_windows64_minimal
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/cache@v4
        with: { path: cef, key: "${{ env.CEFW }}" }

      - name: CEF
        shell: bash
        run: |
          [ -d cef ] || { mkdir cef; curl -sSfL "https://cef-builds.spotifycdn.com/${CEFW//+/%2B}.tar.bz2" | tar xj -C cef; }

      - name: Build
        shell: bash
        run: |
          # Forward slashes: CEF's cmake macros put CEF_ROOT inside strings, where a backslash is an escape.
          cmake -G Ninja -S shell -B build -DCEF_ROOT="$(cygpath -m "$PWD")/cef/$CEFW" -DCMAKE_BUILD_TYPE=Release
          ninja -k 0 -C build

      - name: Checks
        shell: bash
        run: |
          build/util_test.exe
          build/block_test.exe
          node bench/calc_test.js
          node bench/clean_test.js

      - name: Smoke (Thai user folder, CLI over the socket)
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "ทดสอบ"
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          # Plain server: bench/script_server.py exits after the page posts its result.
          $srv = Start-Process python -ArgumentList "-m","http.server","38181","--bind","127.0.0.1","--directory","bench/script-test" -PassThru
          $app = Start-Process build/out/tobari.exe -ArgumentList "http://127.0.0.1:38181/index.html" -PassThru
          $cli = "build/out/tobari-cli.exe"
          $up = $false
          foreach ($i in 1..60) { & $cli tabs *> $null; if ($LASTEXITCODE -eq 0) { $up = $true; break }; Start-Sleep 1 }
          if (-not $up) { Get-Content "$env:LOCALAPPDATA/tobari/cef.log" -ErrorAction SilentlyContinue | Select-Object -Last 30; throw "browser never answered" }
          Start-Sleep 4
          $tabs = & $cli tabs; $tabs
          $id = & $cli open "http://127.0.0.1:38181/index.html?two"
          Start-Sleep 3
          $text = & $cli text $id
          if (-not ($text -match "ภาษาไทย")) { throw "page text missing Thai: $text" }
          $mcp = '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | & $cli mcp | Out-String
          if ($mcp -notmatch "tobari_click") { throw "mcp tools/list failed: $mcp" }
          Stop-Process -Id $app.Id; Stop-Process -Id $srv.Id
          "windows smoke: PASS" >> $env:GITHUB_STEP_SUMMARY

      - name: Package
        shell: pwsh
        run: |
          $v = (git describe --tags --always) -replace '^v',''
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item -Recurse build/out "dist/Tobari"
          Remove-Item dist/Tobari/*.lib, dist/Tobari/*.exp, dist/Tobari/*.pdb -ErrorAction SilentlyContinue
          Compress-Archive dist/Tobari "dist/Tobari-$v-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with: { name: tobari-windows, path: "dist/*.zip" }
