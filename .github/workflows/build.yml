name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ python3-pil \
            libgtk-3-dev libx11-dev libxi-dev libnss3-dev libasound2-dev libatk-bridge2.0-dev \
            libcups2-dev libdrm-dev libgbm-dev desktop-file-utils appstream

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      # Only the archive is cached, never the unpacked tree: provision-cef.sh
      # re-checks the pinned hash on every run, so a poisoned cache entry
      # fails the build instead of flowing into it.
      - name: Cache CEF archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tobari-cef-archive
          key: cef-archive-${{ hashFiles('shell/provision-cef.sh') }}

      - name: Provision CEF
        run: |
          export TOBARI_CEF_ARCHIVE_DIR="$HOME/.cache/tobari-cef-archive" TOBARI_CEF_ALWAYS_VERIFY=1
          echo "CEF_ROOT=$(shell/provision-cef.sh | tail -1)" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cmake -S shell -B build -G Ninja -DCEF_ROOT="$CEF_ROOT" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Checks
        run: |
          test -x build/tobari
          test -f build/extensions/newtab/manifest.json
          test -f build/extensions/shield/manifest.json
          python3 scripts/contrast.py | tee /dev/stderr | grep -q "FAILURES: none"
          desktop-file-validate packaging/dev.tobari.Browser.desktop
          appstreamcli validate --no-net packaging/dev.tobari.Browser.metainfo.xml

  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Build site
        working-directory: site
        run: npm ci && node scripts/build.mjs
