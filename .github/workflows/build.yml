name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ python3-pil \
            libgtk-3-dev libx11-dev libxi-dev libnss3-dev libasound2-dev libatk-bridge2.0-dev \
            libcups2-dev libdrm-dev libgbm-dev desktop-file-utils appstream

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache CEF
        uses: actions/cache@v4
        with:
          path: ~/.cache/tobari-dev
          key: cef-${{ hashFiles('shell/provision-cef.sh') }}

      - name: Provision CEF
        run: echo "CEF_ROOT=$(shell/provision-cef.sh | tail -1)" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cmake -S shell -B build -G Ninja -DCEF_ROOT="$CEF_ROOT" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Checks
        run: |
          test -x build/tobari
          test -f build/extensions/newtab/manifest.json
          test -f build/extensions/shield/manifest.json
          python3 scripts/contrast.py | tee /dev/stderr | grep -q "FAILURES: none"
          desktop-file-validate packaging/dev.tobari.Browser.desktop
          appstreamcli validate --no-net packaging/dev.tobari.Browser.metainfo.xml

  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build site
        working-directory: site
        run: npm ci && node scripts/build.mjs
