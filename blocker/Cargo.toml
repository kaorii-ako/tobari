[package]
name = "tobari-blocker"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "tobari_blocker"
crate-type = ["staticlib"]

[dependencies]
adblock = { version = "0.13", features = ["full-regex-handling"] }
aes = "0.8"
aes-gcm = "0.10"
cbc = "0.1"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
psl = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10"
sha2 = "0.10"

# The Secret Service (D-Bus) holds Chromium's cookie keys on Linux only.
[target.'cfg(target_os = "linux")'.dependencies]
hkdf = "0.12"
secret-service = { version = "5.2.0", features = ["rt-async-io-crypto-rust"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
