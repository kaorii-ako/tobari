<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tobari</title>
<link rel="stylesheet" href="tobari.css">
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><img src="icons/tobari-32.png" alt=""><span>Tobari</span></div>
    <nav class="seg" role="tablist"><span class="seg-thumb" aria-hidden="true"></span>
      <button role="tab" data-view="tabs" aria-selected="false">Tabs</button>
      <button role="tab" data-view="ask" aria-selected="true">Ask</button>
    </nav>
    <button class="icon-btn" id="open-settings" title="Settings"></button>
  </header>

  <section class="view" id="view-tabs" hidden>
    <div class="nav-row">
      <button class="icon-btn" id="nav-back" title="Back (Alt+Left)"></button>
      <button class="icon-btn" id="nav-fwd" title="Forward (Alt+Right)"></button>
      <button class="icon-btn" id="nav-reload" title="Reload"></button>
      <span class="grow"></span>
      <button class="icon-btn" id="organize" title="Group tabs by site (Alt+Shift+O). Shift-click for AI grouping"></button>
      <button class="icon-btn" id="sleep" title="Put idle tabs to sleep now"></button>
    </div>
    <form class="omni" id="omni" autocomplete="off">
      <span class="omni-ic" id="omni-ic"></span>
      <input id="omni-input" spellcheck="false" placeholder="Search or enter address">
    </form>
    <div class="pinned" id="pinned"></div>
    <button class="new-tab" id="new-tab"><span id="new-tab-icon"></span>New tab<span class="kbd">Ctrl T</span></button>
    <div class="tab-list scroll" id="tab-list"></div>
    <footer class="dock">
      <div class="ws-list" id="ws-list"></div>
      <button class="icon-btn" id="ws-add" title="New workspace"></button>
      <span class="grow"></span>
      <button class="icon-btn" id="open-settings-2" title="Settings"></button>
    </footer>
  </section>

  <section class="view" id="view-ask">
    <div class="ask-head">
      <span class="ask-title">Assistant</span>
      <span class="grow"></span>
      <button class="icon-btn" id="new-chat" title="New chat"></button>
      <button class="icon-btn" id="open-settings-3" title="Settings"></button>
    </div>
    <div class="model-bar">
      <button class="dest" id="dest" title="Where your prompts go"><span class="dot off" id="dest-dot"></span><span id="dest-text">Connecting…</span><span id="dest-caret"></span></button>
      <select id="role" class="role" title="Role"></select>
    </div>
    <div class="menu" id="provider-menu" hidden></div>
    <div class="thread scroll" id="thread"></div>
    <div class="composer-wrap">
      <div class="site-tools" id="site-tools" hidden></div>
      <div class="composer card" id="composer">
        <div class="chips" id="chips"></div>
        <textarea id="input" rows="1" placeholder="Ask anything · @ add context · / run a skill"></textarea>
        <div class="composer-foot">
          <button class="icon-btn" id="at-btn" title="Add context (@)"></button>
          <button class="icon-btn" id="slash-btn" title="Skills (/)"></button>
          <button class="icon-btn" id="attach-btn" title="Attach files or PDFs"></button>
          <span class="skill-pill" id="skill-pill" hidden></span>
          <span class="grow"></span>
          <button class="send" id="send" title="Send (Enter)"></button>
        </div>
      </div>
      <div class="menu picker" id="picker" hidden></div>
      <input type="file" id="file" multiple hidden>
    </div>
  </section>
</div>
<script type="module" src="sidepanel.js"></script>
</body>
</html>
