<main>
  <h1>Bangs</h1>
  <p class="lead">Type a bang before or after your search to send it straight to that site. Tobari resolves bangs itself, so the search engine never sees them.</p>
  <p>Example: <kbd>!wth เบราว์เซอร์</kbd> or <kbd>rust async !gh</kbd></p>
  <table id="bangs"><thead><tr><th>Bang</th><th>Site</th></tr></thead><tbody></tbody></table>
</main>
<script src="bangs.js"></script>
