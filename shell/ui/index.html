<!doctype html>
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tobari</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="curtain" id="curtain" aria-hidden="true"></div>

<header class="chrome">
  <div class="tabstrip">
    <div class="tabs" id="tabs" role="tablist" aria-label="Open tabs"></div>
    <button class="newtab" id="newtab" type="button" aria-label="New tab" data-tip="New tab · Ctrl+T">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"/></svg>
    </button>

    <div class="dragzone" id="dragzone" aria-hidden="true"></div>

    <div class="wincontrols">
      <button class="wc" id="winMin" type="button" aria-label="Minimise">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 8.5h8"/></svg>
      </button>
      <button class="wc" id="winMax" type="button" aria-label="Maximise">
        <svg viewBox="0 0 16 16" aria-hidden="true" id="winMaxGlyph"><rect x="4.5" y="4.5" width="7" height="7" rx="1"/></svg>
      </button>
      <button class="wc wc--close" id="winClose" type="button" aria-label="Close window">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
      </button>
    </div>
  </div>

  <div class="toolbar">
    <div class="cluster">
      <button class="icon" id="back" type="button" aria-label="Back" data-tip="Back · Alt+←" disabled>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5L5.5 8l4.5 4.5"/></svg>
      </button>
      <button class="icon" id="forward" type="button" aria-label="Forward" data-tip="Forward · Alt+→" disabled>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5"/></svg>
      </button>
      <button class="icon" id="reload" type="button" aria-label="Reload" data-tip="Reload · Ctrl+R">
        <svg viewBox="0 0 16 16" aria-hidden="true" id="reloadGlyph"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.8V5.4h-2.6"/></svg>
      </button>
    </div>

    <div class="omnibox-wrap" id="omniwrap">
      <div class="omnibox" id="omnibox">
        <span class="omnibox__scheme" id="scheme" aria-hidden="true"></span>
        <span class="bangchip" id="bangchip" hidden></span>
        <input class="omnibox__input" id="input" type="text" spellcheck="false" autocomplete="off"
               role="combobox" aria-expanded="false" aria-controls="dropdown" aria-autocomplete="list"
               placeholder="Search, enter a URL, or type ! for bangs" aria-label="Address and search">
        <button class="shield" id="shield" type="button" data-active="false"
                aria-label="Trackers blocked on this page" data-tip="Blocking · click to toggle for this site">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2l4.5 1.8v4C12.5 10.6 10.6 12.7 8 13.5 5.4 12.7 3.5 10.6 3.5 7.8v-4L8 2z"/></svg>
          <span class="shield__count" id="blockcount">0</span>
        </button>
      </div>
      <div class="dropdown" id="dropdown" role="listbox" aria-label="Suggestions" hidden></div>
    </div>

    <div class="cluster" style="position:relative">
      <button class="icon" id="bookmark" type="button" aria-pressed="false" aria-label="Bookmark this page" data-tip="Bookmark · Ctrl+D">
        <svg viewBox="0 0 16 16" aria-hidden="true" id="bookmarkGlyph"><path d="M4.5 3.5h7v9l-3.5-2.6L4.5 12.5z"/></svg>
      </button>
      <button class="icon" id="panelToggle" type="button" aria-pressed="false" aria-label="Side panel" data-tip="Side panel · Ctrl+B">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3.5" width="11" height="9" rx="1.5"/><path d="M10 3.5v9"/></svg>
      </button>
      <button class="icon" id="menuBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Menu" data-tip="Menu">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h10M3 8h10M3 11.5h10"/></svg>
      </button>

      <div class="menu" id="menu" role="menu" aria-label="Main menu" hidden>
        <button class="menu__item" role="menuitem" data-action="new-tab" type="button">New tab <span class="menu__key">Ctrl T</span></button>
        <button class="menu__item" role="menuitem" data-action="panel" type="button">Side panel <span class="menu__key">Ctrl B</span></button>
        <div class="menu__sep"></div>
        <button class="menu__item" role="menuitem" data-action="reading" type="button">Add to reading list</button>
        <button class="menu__item" role="menuitem" data-action="settings" type="button">Settings</button>
        <button class="menu__item" role="menuitem" data-action="theme" type="button">Switch theme <span class="menu__key" id="themeLabel">night</span></button>
      </div>
    </div>
  </div>

  <div class="progress" id="progress" aria-hidden="true"><div class="progress__bar" id="progressBar"></div></div>
</header>

<aside class="panel" id="panel" aria-label="Side panel" hidden>
  <div class="panel__head">
    <div class="panel__tabs" id="panelTabs" role="tablist" aria-label="Panel sections">
      <button class="ptab" role="tab" data-panel="bookmarks" aria-selected="true" type="button">Bookmarks</button>
      <button class="ptab" role="tab" data-panel="history" aria-selected="false" type="button">History</button>
      <button class="ptab" role="tab" data-panel="reading" aria-selected="false" type="button">Reading</button>
      <button class="ptab" role="tab" data-panel="settings" aria-selected="false" type="button" hidden id="ptabSettings">Settings</button>
    </div>
    <button class="icon" id="panelClose" type="button" aria-label="Close panel" data-tip="Close">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
    </button>
  </div>
  <div class="panel__body" id="panelBody"></div>
</aside>

<script src="vendor/gsap.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
