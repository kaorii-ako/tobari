<!doctype html>
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<title>Panel</title>
<link rel="stylesheet" href="style.css">
<style>
  body { background: var(--ink-100); }
  .panel { position: static; width: 100%; height: 100vh; border-left: none; }
</style>
</head>
<body>
<aside class="panel" id="panel" aria-label="Side panel">
  <div class="panel__head">
    <div class="panel__tabs" id="panelTabs" role="tablist" aria-label="Panel sections">
      <button class="ptab" role="tab" data-panel="bookmarks" aria-selected="true" type="button">Bookmarks</button>
      <button class="ptab" role="tab" data-panel="history" aria-selected="false" type="button">History</button>
      <button class="ptab" role="tab" data-panel="reading" aria-selected="false" type="button">Reading</button>
      <button class="ptab" role="tab" data-panel="settings" aria-selected="false" type="button">Settings</button>
    </div>
    <button class="icon sm" id="panelClose" type="button" aria-label="Close panel">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
    </button>
  </div>
  <div class="panel__body" id="panelBody"></div>
</aside>
<script src="vendor/gsap.min.js"></script>
<script type="module" src="panel.js"></script>
</body>
</html>
