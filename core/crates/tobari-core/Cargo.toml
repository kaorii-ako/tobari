[package]
name = "tobari-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tobari-core"
path = "src/main.rs"

[dependencies]
tobari-ipc = { path = "../tobari-ipc" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
rand = "0.8"
dirs = "5"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
